# Builds and publishes split and universal APKs when a matching version tag is pushed
# or when triggered manually from the GitHub Actions tab.
#
# Required for consistent updates without reinstalling:
# Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD
# under GitHub Settings → Secrets and variables → Actions. The job fails if any is missing,
# so a release can never silently use a different (debug) signing key.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version against pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag v$tag doesn't match pubspec.yaml's version $version"
              exit 1
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Validate bundled scanner CIDRs
        working-directory: scanner
        run: go run ./cmd/normalize_scanner_cidrs --check ../assets/scanner

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Psiphon exit (built from source with the NDK)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build_psiphon.sh

      - name: Tor and lyrebird (Tor Project's expert bundles, hash-checked)
        run: bash scripts/fetch_tor.sh

      - name: Xray core (built from xray/ with gomobile and the NDK)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build_xray.sh

      - name: Free Go build cache before APK packaging
        run: |
          go clean -cache -modcache
          df -h /

      - name: Routing data (Chocolate4U/Iran-v2ray-rules, latest)
        run: bash scripts/fetch_geo.sh

      - name: Minify worker
        working-directory: worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run minify

      - name: Tor bridges for the setup wizard (fresh each build)
        run: bash scripts/fetch_tor_bridges.sh

      - run: flutter pub get --enforce-lockfile

      - run: flutter test --no-pub

      - name: Build & Sign release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Release signing secrets are missing. Add KEYSTORE_BASE64 (a PKCS12 keystore), KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings → Secrets and variables → Actions. Signing each release with a different key makes Android refuse the update."
            exit 1
          fi
          mkdir -p android/keystore
          cleanup() {
            rm -f android/key.properties android/keystore/release.p12
          }
          trap cleanup EXIT

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.p12
          keytool -list -keystore android/keystore/release.p12 \
            -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            printf 'storeFile=../keystore/release.p12\n'
            printf 'storeType=PKCS12\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

          mkdir -p dist
          # Publish the signing certificate fingerprint next to the APKs. Every release must
          # show the same SHA-256; compare it before publishing to be sure the update will
          # install over the previous version without uninstalling it.
          cert_sha256=$(keytool -list -v -keystore android/keystore/release.p12 \
            -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          if [ -z "$cert_sha256" ]; then
            echo "::error::Could not read the release certificate fingerprint from the keystore."
            exit 1
          fi
          printf 'SHA-256: %s\n' "$cert_sha256" > dist/SIGNING_CERT.txt

          flutter build apk --release --split-per-abi --no-pub
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ ! -s "$apk" ]; then
              echo "::error::Expected APK was not created: $apk"
              exit 1
            fi
            cp "$apk" "dist/miliconfig-$VERSION-$abi.apk"
          done

          flutter build apk --release --no-pub
          apk="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$apk" ]; then
            echo "::error::Expected universal APK was not created: $apk"
            exit 1
          fi
          cp "$apk" "dist/miliconfig-$VERSION-universal.apk"

      - name: Generate APK SHA-256 checksums
        run: sha256sum dist/miliconfig-*.apk > dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: MiliConfig ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.apk
            dist/SHA256SUMS
            dist/SIGNING_CERT.txt
